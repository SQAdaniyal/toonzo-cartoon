name: ToonZo Daily Cartoons

on:
  schedule:
    # 3:00 AM Pakistan time (22:00 UTC). GitHub schedule timing is best-effort.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonzo-cartoon-preview
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate cartoons and upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_TO_YOUTUBE: "true"
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_MADE_FOR_KIDS: "true"
        run: python main.py

      - name: Save topic and title history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in used_topics.json content_history.json video_history.json; do
            if [[ -f "$file" ]]; then
              git add -f -- "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Save ToonZo content history [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin \
                "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort
                echo "Could not rebase content history onto the latest branch."
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "History push attempt $attempt failed; retrying."
              sleep 2
            done
            echo "Could not push content history after 3 attempts."
            exit 1
          else
            echo "No content history changes to save."
          fi
