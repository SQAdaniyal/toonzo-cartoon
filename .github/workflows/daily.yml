name: ToonZo Daily Cartoons

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonzo-cartoon-preview
  cancel-in-progress: false

jobs:
  generate-and-upload:
    if: false # Paused during channel consolidation; Facts Baaz is the active channel.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        timeout-minutes: 20
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-match DejaVuSans >/dev/null 2>&1 || ! command -v espeak-ng >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu espeak-ng; then
                exit 0
              fi
              if [[ "$attempt" -eq 3 ]]; then exit 1; fi
              sleep 10
            done
          fi

      - name: Install Python deps
        timeout-minutes: 20
        run: pip install --disable-pip-version-check --retries 5 --timeout 30 -r requirements.txt

      - name: Generate cartoons and upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_TO_YOUTUBE: "true"
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_MADE_FOR_KIDS: "true"
        run: timeout --signal=TERM --kill-after=60s 75m python -u main.py 2>&1 | tee run.log
        shell: bash

      - name: Keep run log and rendered videos for recovery
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: toonzo-run-${{ github.run_id }}
          path: |
            run.log
            output/**/*.mp4
            output/**/*.srt
          if-no-files-found: ignore
          retention-days: 7

      - name: Save topic and title history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in used_topics.json content_history.json video_history.json; do
            if [[ -f "$file" ]]; then
              git add -f -- "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Save ToonZo content history [skip ci]"
            for attempt in 1 2 3; do
              if ! git fetch origin \
                "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"; then
                echo "History fetch attempt $attempt failed; retrying."
                sleep 2
                continue
              fi
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort
                echo "Could not rebase content history onto the latest branch."
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "History push attempt $attempt failed; retrying."
              sleep 2
            done
            echo "Could not push content history after 3 attempts."
            exit 1
          else
            echo "No content history changes to save."
          fi
