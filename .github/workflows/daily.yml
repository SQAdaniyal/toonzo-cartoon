name: ToonZo Daily Cartoons

on:
  schedule:
    # 6:30 PM Pakistan time (13:30 UTC). GitHub schedule timing is best-effort.
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonzo-cartoon-preview
  cancel-in-progress: false

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate cartoons (scheduled upload, manual preview)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_TO_YOUTUBE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_MADE_FOR_KIDS: "true"
        run: python main.py

      - name: Save manual preview videos for review
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: toonzo-preview-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/*.srt
          if-no-files-found: warn
          retention-days: 7

      - name: Save topic and title history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in used_topics.json content_history.json video_history.json; do
            if [[ -f "$file" ]]; then
              git add -f -- "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Save ToonZo content history [skip ci]"
            git push
          else
            echo "No content history changes to save."
          fi
